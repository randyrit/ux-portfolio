<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Insights — Cloud Theory</title>
  <link rel="stylesheet" href="components.css" />
</head>
<body>
<div class="app">

  <!-- ========================
       SIDEBAR
  ========================= -->
  <aside class="sidebar">

    <div class="sidebar-logo">
      <svg height="24" viewBox="0 0 190 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <text x="0" y="17" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827">Cloud</text>
        <path d="M52 2L48 14h5l-2 8 8-12h-5l3-8z" fill="#7c64f3"/>
        <text x="68" y="17" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827">Theory</text>
      </svg>
    </div>

    <select class="sidebar-dealer-select">
      <option selected>South Bay Ford</option>
      <option>South Bay Ford Lincoln</option>
      <option>South Bay Lincoln</option>
      <option>Galpin Ford</option>
      <option>AutoNation Ford Torrance</option>
    </select>

    <!-- Main Nav -->
    <div class="sidebar-section">
      <a class="sidebar-item" href="dashboard.html">
        Dealer Overview
      </a>

      <a class="sidebar-item active" href="market-insights.html">
        Market Insights
      </a>

      <a class="sidebar-item" href="#">
        Model Insights
      </a>

      <a class="sidebar-item" href="#">
        Inventory
      </a>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-section">
      <a class="sidebar-item" href="#">
        Store Performance
      </a>

      <a class="sidebar-item" href="#">
        Market Performance
      </a>
    </div>

    <!-- Footer -->
    <div class="sidebar-footer">
      <a class="sidebar-footer-item" href="#">
        Ruttapon R.
      </a>
    </div>

  </aside>

  <!-- ========================
       MAIN
  ========================= -->
  <div class="main-content">

    <!-- Top Bar -->
    <header class="topbar">
      <span class="topbar-title">Market Insights</span>
      <div class="topbar-right">
        <span class="topbar-meta" id="region-label"></span>
        <select class="topbar-select" id="radius-select">
          <option value="5">5 mi</option>
          <option value="10">10 mi</option>
          <option value="15">15 mi</option>
          <option value="20">20 mi</option>
          <option value="25" selected>25 mi</option>
        </select>
      </div>
    </header>

    <!-- Page Body -->
    <div class="page-body">

      <!-- Summary Stats -->
      <div class="stats-row" id="summary-stats"></div>

      <!-- Charts Row: Top Vehicles + Top Dealerships -->
      <div class="charts-grid">

        <!-- Top 10 Most Sold Vehicles -->
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title">Top 10 Most Sold Vehicles</span>
            <select class="chart-filter">
              <option>Last 15 Days</option>
              <option>Last 30 Days</option>
              <option>Last 60 Days</option>
              <option selected>Last 90 Days</option>
            </select>
          </div>
          <div class="bar-chart" id="vehicles-chart"></div>
        </div>

        <!-- Top 5 Dealerships -->
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title">Top Dealerships by Volume</span>
            <select class="chart-filter">
              <option>Last 15 Days</option>
              <option>Last 30 Days</option>
              <option>Last 60 Days</option>
              <option selected>Last 90 Days</option>
            </select>
          </div>
          <div class="bar-chart" id="dealers-chart"></div>
        </div>

      </div>

      <!-- Bottom Row: Segment Breakdown + Price Distribution -->
      <div class="charts-grid">

        <!-- Segment Breakdown -->
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title">Sales by Segment</span>
            <select class="chart-filter">
              <option>Last 15 Days</option>
              <option>Last 30 Days</option>
              <option>Last 60 Days</option>
              <option selected>Last 90 Days</option>
            </select>
          </div>
          <div class="bar-chart" id="segment-chart"></div>
        </div>

        <!-- Price Distribution -->
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title">Price Distribution</span>
            <select class="chart-filter">
              <option>Last 15 Days</option>
              <option>Last 30 Days</option>
              <option>Last 60 Days</option>
              <option selected>Last 90 Days</option>
            </select>
          </div>
          <div class="bar-chart" id="price-chart"></div>
        </div>

      </div>

    </div>
  </div>
</div>

<script src="market-insights-data.js"></script>
<script>
  // ---- Region label ----
  document.getElementById('region-label').textContent = MarketData.region;

  // ---- Summary Stats ----
  const statsRow = document.getElementById('summary-stats');
  MarketData.summary.forEach(s => {
    statsRow.innerHTML += `
      <div class="stat-card-sm">
        <span class="stat-card-sm-label">${s.label}</span>
        <span class="stat-card-sm-value">${s.value}</span>
      </div>`;
  });

  // ---- Top 10 Vehicles Chart ----
  const vMax = Math.max(...MarketData.topVehicles.map(v => v.units));
  const vChart = document.getElementById('vehicles-chart');
  MarketData.topVehicles.forEach(v => {
    const pct = Math.round((v.units / vMax) * 100);
    vChart.innerHTML += `
      <div class="bar-row">
        <span class="bar-label">${v.model}</span>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%"></div>
        </div>
        <span class="bar-value">${v.units.toLocaleString()}</span>
      </div>`;
  });

  // ---- Top 5 Dealerships Chart ----
  const dMax = Math.max(...MarketData.topDealerships.map(d => d.units));
  const dChart = document.getElementById('dealers-chart');
  MarketData.topDealerships.forEach((d, i) => {
    const pct = Math.round((d.units / dMax) * 100);
    dChart.innerHTML += `
      <div class="bar-row">
        <span class="bar-label">${d.name}<span class="bar-label-sub">${d.distance}</span></span>
        <div class="bar-track">
          <div class="bar-fill ${i === 0 ? 'bar-fill-highlight' : ''}" style="width:${pct}%"></div>
        </div>
        <span class="bar-value">${d.units.toLocaleString()}</span>
      </div>`;
  });

  // ---- Segment Breakdown ----
  const sChart = document.getElementById('segment-chart');
  MarketData.segmentBreakdown.forEach(s => {
    sChart.innerHTML += `
      <div class="bar-row">
        <span class="bar-label">${s.segment}</span>
        <div class="bar-track">
          <div class="bar-fill" style="width:${s.share}%"></div>
        </div>
        <span class="bar-value">${s.share}%</span>
      </div>`;
  });

  // ---- Price Distribution ----
  const pChart = document.getElementById('price-chart');
  MarketData.priceDistribution.forEach(p => {
    pChart.innerHTML += `
      <div class="bar-row">
        <span class="bar-label">${p.range}</span>
        <div class="bar-track">
          <div class="bar-fill" style="width:${p.pct}%"></div>
        </div>
        <span class="bar-value">${p.pct}%</span>
      </div>`;
  });
</script>

</body>
</html>
