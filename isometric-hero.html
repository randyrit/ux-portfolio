<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Hero - Isometric View</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 2000px;
    cursor: grab;
    user-select: none;
  }

  body.dragging { cursor: grabbing; }

  .scene {
    display: grid;
    grid-template-columns: 380px 380px;
    gap: 20px;
    transform-style: preserve-3d;
    transition: transform 0.05s linear;
  }

  .screen {
    border-radius: 8px;
    overflow: hidden;
    box-shadow: none;
  }

  .screen img {
    display: block;
    width: 380px;
    height: auto;
    border-radius: 8px;
    pointer-events: none;
  }

  .glow {
    position: fixed;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    filter: blur(160px);
    opacity: 0.10;
    pointer-events: none;
  }

  .glow-1 { background: #48bb78; top: 5%; left: 15%; }
  .glow-2 { background: #4299e1; bottom: 5%; right: 10%; }

  .hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 13px;
    pointer-events: none;
    transition: opacity 0.5s;
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="scene" id="scene">
    <div class="screen">
      <img src="images/Desktop - 34.png" alt="Files View">
    </div>
    <div class="screen">
      <img src="images/Desktop - 33.png" alt="Tags View">
    </div>
    <div class="screen">
      <img src="images/Desktop - 32.png" alt="Disclosures Data View">
    </div>
    <div class="screen">
      <img src="images/Frame 47623.png" alt="Review Details View">
    </div>
  </div>

  <div class="hint" id="hint">Drag to rotate &middot; Scroll to zoom</div>

  <script>
    const scene = document.getElementById('scene');
    const hint = document.getElementById('hint');

    let rotX = 45;
    let rotZ = -45;
    let scale = 1.6;
    let isDragging = false;
    let lastX, lastY;

    function updateTransform() {
      scene.style.transform =
        `rotateX(${rotX}deg) rotateZ(${rotZ}deg) scale(${scale})`;
    }

    updateTransform();

    document.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      document.body.classList.add('dragging');
      hint.style.opacity = '0';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      rotZ += dx * 0.3;
      rotX -= dy * 0.3;
      rotX = Math.max(-90, Math.min(90, rotX));
      lastX = e.clientX;
      lastY = e.clientY;
      updateTransform();
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
      document.body.classList.remove('dragging');
    });

    document.addEventListener('wheel', (e) => {
      e.preventDefault();
      scale += e.deltaY * -0.001;
      scale = Math.max(0.3, Math.min(3, scale));
      updateTransform();
    }, { passive: false });
  </script>
</body>
</html>
